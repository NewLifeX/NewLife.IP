# فارسی 词表（fa）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"CSV file not found.": "فایل CSV پیدا نشد."
"No valid records in the CSV file.": "هیچ رکورد معتبری در فایل CSV وجود ندارد."
"Unable to find the IP database {0}": "پایگاه داده IP {0} پیدا نشد"
"IP database: {0}": "پایگاه داده IP: {0}"
