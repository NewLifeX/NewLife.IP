"IP database {0} has expired; downloading an update from {1}.": "پایگاه داده IP {0} منقضی شده است؛ در حال دانلود به‌روزرسانی از {1}."
"IP database downloaded successfully: {0}": "پایگاه داده IP با موفقیت دانلود شد: {0}"
"Failed to download the IP database; the file does not exist: {0}": "دانلود پایگاه داده IP ناموفق بود؛ فایل وجود ندارد: {0}"
"IP record count: {0:n0}": "تعداد رکوردهای IP: {0:n0}"
"IP database conversion completed: {0:n0} records → {1}": "تبدیل پایگاه داده IP کامل شد: {0:n0} رکورد → {1}"
