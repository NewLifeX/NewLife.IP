# Bahasa Melayu 词表（ms）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"CSV file not found.": "Fail CSV tidak ditemui."
"No valid records in the CSV file.": "Tiada rekod sah dalam fail CSV."
"Unable to find the IP database {0}": "Tidak dapat menemui pangkalan data IP {0}"
"IP database: {0}": "Pangkalan data IP: {0}"
"IP database {0} was not found; downloading from {1}.": "Pangkalan data IP {0} tidak ditemui; memuat turun daripada {1}."
"IP database {0} has expired; downloading an update from {1}.": "Pangkalan data IP {0} telah tamat tempoh; memuat turun kemas kini daripada {1}."
"IP database downloaded successfully: {0}": "Pangkalan data IP berjaya dimuat turun: {0}"
"Failed to download the IP database; the file does not exist: {0}": "Gagal memuat turun pangkalan data IP; fail tidak wujud: {0}"
"IP record count: {0:n0}": "Bilangan rekod IP: {0:n0}"
"IP database conversion completed: {0:n0} records → {1}": "Penukaran pangkalan data IP selesai: {0:n0} rekod → {1}"
