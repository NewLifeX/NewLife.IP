# Dansk 词表（da）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"CSV file not found.": "CSV-fil blev ikke fundet."
"No valid records in the CSV file.": "Der er ingen gyldige poster i CSV-filen."
"Unable to find the IP database {0}": "Kan ikke finde IP-databasen {0}"
"IP database: {0}": "IP-database: {0}"
"IP database {0} was not found; downloading from {1}.": "IP-databasen {0} blev ikke fundet; downloader fra {1}."
"IP database {0} has expired; downloading an update from {1}.": "IP-databasen {0} er udløbet; downloader en opdatering fra {1}."
"IP database downloaded successfully: {0}": "IP-databasen blev downloadet: {0}"
"Failed to download the IP database; the file does not exist: {0}": "Download af IP-databasen mislykkedes; filen findes ikke: {0}"
"IP record count: {0:n0}": "Antal IP-poster: {0:n0}"
"IP database conversion completed: {0:n0} records → {1}": "Konvertering af IP-database fuldført: {0:n0} poster → {1}"
