name: test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  # 原生 RID 矩阵：win-x64 / linux-x64 / linux-arm64 为阻断门禁；linux-la64（QEMU）见下方独立 job
  # 测试数据由 XUnitTest.csproj 的 CopyToOutputDirectory 自动复制（仓库根 ip.gz → 输出 Data/），离线即可跑
  test:
    name: test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Build Solution
      # 全解决方案编译校验（NewLife.IP / XUnitTest / Test / AotSmoke），单跑一次即可
      if: matrix.rid == 'win-x64'
      run: dotnet build NewLife.IP.slnx -c Release --nologo
    - name: Test
      # xUnit v3 走 Microsoft.Testing.Platform（global.json 已指定 test.runner），--project 为 .NET 10 新 dotnet test 语法
      run: dotnet test --project XUnitTest/XUnitTest.csproj -c Release --nologo

  # Linux LoongArch64（LA64，非阻塞观察项）：GitHub 无 LA64 runner/runtime pack，
  # 采用 docker + QEMU 用户态仿真（loong64 binfmt）+ 龙芯 SDK 在 loong64 容器内跑 net10.0 全量单测。
  # 容器内不装 ICU（invariant 模式，测试无 culture 依赖，消除 apt 慢源卡点）；
  # xUnit v3 自带 Microsoft.Testing.Platform 进程内执行器，直接以 LA64 运行时执行测试程序集即可，无需 vstest。
  # continue-on-error：该 RID 的目标是尽早暴露龙芯平台兼容问题，任何环节出错都不阻塞主分支。
  loongarch64:
    name: test (linux-la64 qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET (host, for build)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Set up QEMU (loong64)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: loong64
    - name: Download Loongson .NET SDK (linux-loongarch64)
      # 宿主下载（GitHub 直连快），容器通过挂载点使用；容器内 --info 是 QEMU 通路的第一道验证
      run: |
        curl -fL -o "$HOME/la64-sdk.tar.gz" \
          https://github.com/loongson/dotnet/releases/download/v10.0.113-loongarch64/dotnet-sdk-10.0.113-linux-loongarch64.tar.gz
        mkdir -p "$HOME/la64" && tar -xzf "$HOME/la64-sdk.tar.gz" -C "$HOME/la64"
        chmod +x "$HOME/la64/dotnet" || true
    - name: Build Test Assembly (host x64 SDK)
      # 龙芯 SDK 在 QEMU 下的 MSBuild 链路不稳，构建放宿主 x64 SDK（产出 RID 无关的 IL 与可移植 deps.json），
      # 容器内仅以 LA64 运行时执行测试
      run: dotnet build XUnitTest/XUnitTest.csproj -c Release --nologo
    - name: Unit Tests (net10.0) in loong64 Container
      # 容器内不装 ICU（invariant 模式，测试无 culture 依赖，消除 apt 慢源卡点）；
      # DOTNET_EnableHWIntrinsic=0：QEMU 用户态对 LASX/LSX 指令覆盖不全，JIT 动态桩实测触发
      # Illegal instruction（ExecutionEngineException），关闭硬件内建以强制基线指令；
      # xUnit v3 测试程序集自身就是 MTP 执行器，直接 dotnet XUnitTest.dll（无需 vstest / 自宿主加载器）；
      # 分段日志（[1/3]~[3/3] + 时间戳）用于定位 QEMU 下的慢点
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
      run: |
        docker run --rm --platform linux/loong64 \
          -v "$PWD:/src" -w /src \
          -v "$HOME/la64:/opt/dotnet" \
          -e DOTNET_ROOT=/opt/dotnet \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
          -e DOTNET_EnableHWIntrinsic=0 \
          lcr.loongnix.cn/debian:14-slim \
          sh -c '
            set -e
            echo "[1/3] $(date +%T) dotnet --info"
            /opt/dotnet/dotnet --info
            echo "[2/3] $(date +%T) run tests"
            cd /src/Bin/UnitTest/net10.0
            timeout 30m /opt/dotnet/dotnet ./XUnitTest.dll
            echo "[3/3] $(date +%T) done"
          '

  localization:
    name: localization checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Check locales
      shell: pwsh
      run: |
        $failed = $false
        Get-ChildItem -Path . -Recurse -Directory -Filter Locales | ForEach-Object {
          if (Test-Path (Join-Path $_.FullName 'zh-Hans.yml')) {
            $src = Split-Path $_.FullName -Parent
            pwsh -File ./check-locales.ps1 -LocaleDir $_.FullName -Baseline zh-Hans.yml -SourceDir $src
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
        }
        if ($failed) { exit 1 }
    - name: Check README languages
      shell: pwsh
      run: pwsh -File ./sync-readme-languages.ps1 -Check
