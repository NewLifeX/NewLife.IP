name: aot

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  # AOT 防回归（非阻塞观察项）：分析器 0 告警硬约束（与 RID 无关，单一 job）。
  # net8.0+ 目标启用 IsAotCompatible，-warnaserror 使新增 trim/AOT 分析器告警直接暴露；
  # continue-on-error：AOT 兼容问题不阻塞主分支合并。
  aot-analyzer:
    name: aot analyzer check
    # 分析器与 RID 无关，优先用 Ubuntu（更省成本）；NativeAOT 矩阵仍按 RID 用原生 runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: AOT Analyzer Check
      run: |
        dotnet build NewLife.IP/NewLife.IP.csproj -f net8.0 -c Release -warnaserror
        dotnet build NewLife.IP/NewLife.IP.csproj -f net9.0 -c Release -warnaserror
        dotnet build NewLife.IP/NewLife.IP.csproj -f net10.0 -c Release -warnaserror

  # NativeAOT 冒烟矩阵（非阻塞观察项）：NativeAOT 官方不支持跨 OS 编译，每个 RID 用原生 runner 发布运行（AotSmoke 21 场景）。
  # win-x64 / linux-x64 / linux-arm64 全覆盖；linux-la64 见文件末尾 job。任何失败仅记录、不阻塞主分支。
  aot:
    name: aot (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            bin: AotSmoke.exe
          - rid: linux-x64
            os: ubuntu-latest
            bin: AotSmoke
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            bin: AotSmoke

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Install NativeAOT Prerequisites (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: JIT Baseline
      # 同一冒烟工程以 JIT 运行（21 场景），为 AOT 结果提供对照
      run: dotnet run -c Release --project AotSmoke/AotSmoke.csproj
    - name: Publish NativeAOT Smoke
      run: dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o AotSmoke/bin/aot-out
    - name: Run NativeAOT Smoke
      # 任一场景失败即非 0 退出码
      shell: bash
      run: ./AotSmoke/bin/aot-out/${{ matrix.bin }}

  # Linux LoongArch64（LA64，非阻塞观察项）：NativeAOT 官方无 LA64 目标（ILCompiler 未承诺），
  # 以该 RID 的 JIT 运行验证库的 LA64 兼容性（AotSmoke 21 场景），NativeAOT 发布列为探索项。
  # 方案：docker + QEMU 用户态仿真（loong64 binfmt）+ 龙芯 SDK 在 loong64 容器内执行 ——
  # 裸宿主缺 LA64 动态加载器（Could not open /lib64/ld-linux-loongarch-lp64d.so.1），必须在容器内执行；
  # 基础镜像 lcr.loongnix.cn/debian:14-slim 为 Debian unstable loong64 端口，自带 loader 与可用 apt（deb.debian.org）。
  loongarch64:
    name: aot (linux-la64 qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET (host, for build)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Set up QEMU (loong64)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: loong64
    - name: Download Loongson .NET SDK (linux-loongarch64)
      # 宿主下载（GitHub 直连快），容器通过挂载点使用；容器内 --info 是 QEMU 通路的第一道验证
      run: |
        curl -fL -o "$HOME/la64-sdk.tar.gz" \
          https://github.com/loongson/dotnet/releases/download/v10.0.113-loongarch64/dotnet-sdk-10.0.113-linux-loongarch64.tar.gz
        mkdir -p "$HOME/la64" && tar -xzf "$HOME/la64-sdk.tar.gz" -C "$HOME/la64"
        chmod +x "$HOME/la64/dotnet" || true
    - name: Build AotSmoke (host x64 SDK)
      # 龙芯 SDK 在 QEMU 下的 MSBuild 链路不稳，构建放宿主 x64 SDK（产出 RID 无关 IL），容器内仅以 LA64 运行时执行
      run: dotnet build AotSmoke/AotSmoke.csproj -c Release --nologo
    - name: JIT Smoke in loong64 Container (AotSmoke 21 场景)
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
      run: |
        docker run --rm --platform linux/loong64 \
          -v "$PWD:/src" -w /src \
          -v "$HOME/la64:/opt/dotnet" \
          -e DOTNET_ROOT=/opt/dotnet \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
          -e DOTNET_EnableHWIntrinsic=0 \
          lcr.loongnix.cn/debian:14-slim \
          sh -c '/opt/dotnet/dotnet --info && /opt/dotnet/dotnet /src/AotSmoke/bin/Release/net10.0/AotSmoke.dll'
    - name: NativeAOT Publish (linux-loongarch64, 探索)
      continue-on-error: true
      run: |
        docker run --rm --platform linux/loong64 \
          -v "$PWD:/src" -w /src \
          -v "$HOME/la64:/opt/dotnet" \
          -e DOTNET_ROOT=/opt/dotnet \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
          lcr.loongnix.cn/debian:14-slim \
          sh -c '/opt/dotnet/dotnet publish AotSmoke/AotSmoke.csproj -c Release -r linux-loongarch64 -o AotSmoke/bin/aot-out-la64'
    - name: Run NativeAOT Smoke (linux-loongarch64, 探索)
      continue-on-error: true
      run: |
        if [ -x AotSmoke/bin/aot-out-la64/AotSmoke ]; then
          docker run --rm --platform linux/loong64 \
            -v "$PWD:/src" -w /src \
            lcr.loongnix.cn/debian:14-slim \
            ./AotSmoke/bin/aot-out-la64/AotSmoke
        else
          echo "未产出 linux-loongarch64 原生可执行文件（NativeAOT 当前不支持 LA64），跳过运行"
        fi
